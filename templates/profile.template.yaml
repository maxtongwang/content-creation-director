# profile.yaml —— 账号定位（全流程地基）
# 由 workflows/1-account.md + 2-ip.md 产出
#
# ⚠️ SYNC: 本文件的字段名被 automation/ 层直接引用（配额、指标聚合）。
#          增删字段前查 docs/sync-notes.md，并同步 automation/spec.automation.yaml。
#
# ============ 两层，性质不同，不要混着改 ============
#
# 数据层   可被 ledger 验证，随数据修正
#          pillars / content_lines / targets 权重 / series 表现 / styles
#
# 价值观层 数据测不到，由本人决定，**不因数据差就改**
#          tone / production / identity_exposure / forbidden_topics / surface_rule
#
# 数据能验证「做什么有效」，验证不了「该怎么做人」。两层都要，不是替代关系。
# SYNC: A6 只对价值观层做合规检查，不得基于 metrics 建议修改它们。
#
profile_version: "1.0"
profile_id: <短标识>
updated: "<YYYY-MM-DD>"

# ============ 商业定位（第一位）============
business:
  has_product: true | false
  model: 电商 | 咨询 | 广告
  sells: <卖什么给谁>
  price_band: <客单价区间>
  buy_frequency: <一次性 | 可复购>

targets:                          # 变现目标，按 rank 排序 ★ 数据层：权重随表现修正
  <key>:
    label: <名称>
    rank: 1
    weight: <配比权重>
    fears: <他最怕什么>
    proof_needed: <他需要什么证明>
    handled_by: self | team
    mode: normal | opportunistic

content_lines:                    # 目标数 ≠ 内容线数 ★ 数据层
  <线名>: { serves: [<target key>...], driver: <主 target> }

# ============ 内容定位 ============
content_position: 主题IP | 人物IP

# ============ IP 策划（五要素）============
ip:
  身份: <你是谁，凭什么讲>
  场景: <内容发生在哪>
  道具: <反复出现的物件>     # 别留空
  态度: <立场，会拒绝什么>
  呈现: 出镜 | 口播 | b_roll_vo | 图文

  真实部分: [<性格>, <作风>, <习惯>, <口头禅>]
  设计部分: [<围绕真实的放大>]
  缺点: <无伤大雅、能引发共情的那个>

  验证:
    颠覆检查: pass | fail    # 观众发现你不是这样会怎样
    可持续检查: pass | fail  # 能演三年吗
    缺点检查: pass | fail

  露出配额: { max: 3, window: 10, unit: posts }   # 上限，不是下限

# ============ 本人经历 ★ 事实层，不可推断 ============
# 由 2-ip 访谈产出。任何以「我曾经…」「我从…转到…」为前提的选题，
# 必须先查这里 —— 从公开数据推断本人经历，推错会让整条选题作废。
# SYNC: 3-topic 与 9-deliver 的事实核对读这个块
ip_analysis:
  职业路径: <按时间顺序，谁先谁后要准；不可从公开信息推断>
  最骄傲的事: <本人自己说的那件，不是看起来最厉害的那件>
  最挫折的事: <愿意公开讲的那件>
  缺点: <与 ip.缺点 一致；无伤大雅、能引发共情>
  不可推断项: [<明确标出哪些事实只能由本人确认>]

# ============ 禁区（最重要）============
forbidden_topics:                 # 完全不做 ★ 价值观层：本人决定，数据不能推翻
  - <...>

identity_fragments:               # 真实但只做注脚
  <名称>:
    note: <说明>
    usage: tag_only | mention_only
    max_per_month: <n>
    forbid: [开系列, 进标题, 作为选题主题]

# ============ 内容支柱 ============
pillars:  # ★ 数据层：随 ledger 表现修正
  <名称>: { tier: A|B|C, line: <内容线>, tag: "<#标签>" | null }

pillar_rules:
  monthly_featured: 2
  composition: "1 个 A + 1 个 B；每条内容线各覆盖一个"
  rotate_every: quarter
  tier_C_in_title: false

# ============ 系列 ============
series:  # ★ 数据层：表现决定去留
  <系列名>:
    type: 剧情 | 提升 | 挑战探索 | 容器 | 搜索型
    mechanism: 计数 | 悬念 | 时间 | 搜索
    cost: lowest | low | medium | high
    target: <target key> | both
    naming_check: { 锁结果: false, 锁时长: false, 锁场景: false, 锁频率: false }
    requires_human: [<需人工把关的环节>]

# ============ 账户搭建 ============
account:
  昵称: <有记忆点 + 有信息量>
  简介: |
    <实际简介全文>
  头像: <描述>
  头图: <描述>
  forbid: [欢迎咨询, 全程服务, 求关注]

super_symbol:
  MI理念: <反复讲的那句话>
  BI行为: <反复做的那个动作>
  VI视觉: <反复出现的那个样子>

# ============ 风格档案 ★ 多风格必填 ============
# 风格 = 一组剪辑参数，不是标签。见 workflows/8-styles.md
# SYNC: style 名被 ledger.content_layer.style 与 style_roi 引用
styles:  # ★ 数据层（剪辑参数）；其中 fixed_elements 属价值观层
  <风格名>:
    when: <什么内容用这个风格>
    script_structure: 讲故事 | 晒过程 | 教知识 | 聊观点 | 尬段子 | 说产品
    form: 出镜 | b_roll_vo | 图文 | 情景剧
    edit:
      pace: 慢 | 中 | 快
      avg_shot_sec: [<下限>, <上限>]
      cut_density: <每分钟切镜数>
      transition: 硬切 | 匹配剪 | 叠化
      bgm: none | 低 | 中 | 高
      subtitle: 无 | 基础 | 花字
      vo_handling: 全保留 | 删长静默 | 紧凑
      speed_ramp: false | true
      color: 原生 | 统一调色
    identity:
      self_presence_required: true | false
      max_gap_seconds: 90
      min_ratio: 0.15
    # ★ 固定元素 —— 这个风格里每次都要出现的东西。确认一次，永久复用。
    # 5-script 与 6-edit 必须照此产出，不要每次重问。
    fixed_elements:
      开场: <固定片头 / 固定第一句 / 固定动作>
      口头禅: [<每期都会说的话>]
      固定环节: [<每期必有的段落，如「今日三件事」>]
      固定道具: [<反复出现的物件>]
      voice: <配音用的固定声音；本人克隆音建好后写这里，长期复用>
      bgm: <固定曲目或曲库>
      转场: <固定转场方式>
      字幕样式: <字体 / 位置 / 颜色>
      片尾: <固定结尾句 / 固定动作>
      禁用: [<这个风格里绝对不做的，如「不加花字」>]

    reference: <一条自己认可的成片，作为对齐基准>   # 最重要的一行

# ============ 分平台档案 ★ 多平台必填 ============
# 定位跨平台，封装分平台。见 references/platform-playbook.md
# SYNC: platform 名被 ledger 与 automation 的 per_platform 配额引用
platforms:
  <平台名>:                       # xiaohongshu | youtube
    handle: <账号名/ID>
    status: 未开号 | 起号中 | 稳定运营
    priority: 主场 | 次要 | 试水
    primary_metric: 收藏 | 完播率 | AVD      # 判成败只看这个
    baseline:                                # 自己的历史均值，不是行业均值
      <指标名>: <值>
    adapt:                                   # 这个平台的封装约束
      title_max: <n>
      preferred_form: 图文 | 短视频 | 长视频
      duration_range: [<下限秒>, <上限秒>]
    source: scanned | inferred | confirmed   # 1d-scan 自动填时标注来源

# ============ 长期记忆 · 已验证的结论 ============
# 由 workflows/7-review.md 的假设回验写回。这是 skill 变准的机制。
# 只写「被数据验证过的」，猜测不进这里。
learned:
  works:                          # 验证有效，以后优先用
    - what: <做法，如「标题用身份反差句式」>
      evidence: <哪几条内容、什么数据支持>
      confirmed: "<YYYY-MM-DD>"
      applies_to: [<平台>]        # 有效性经常是分平台的

  fails:                          # 验证无效，以后不要再提
    - what: <做法>
      evidence: <连续 N 次采纳后指标无提升>
      retired: "<YYYY-MM-DD>"

  audience:                       # 观众实际认知（来自评论区）
    称呼: [<观众怎么叫他>]
    常问: [<反复出现的提问 —— 天然选题库>]
    认可: [<观众实际夸什么>]

  open_questions:                 # 还没验证的假设，下次复盘时检查
    - <假设及验证方式>

# ============ 制作限制 ============
production:
  platforms: [<平台>]              # 与上面 platforms 的 key 一致
  aspect_ratio: <画幅>
  crop: none | per_platform
  can_show_face: true | false
  weekly_capacity: <条>
  equipment: [<设备>]
  edit_mode: ai_full | human | hybrid     # 决定 6-edit 走哪个分支
  edit_tool: <自己剪用什么软件>

# ============ 语气 ★ 价值观层 ============
# ⚠️ 本块分两类，agent 必须区分：
#    _internal_* = 内部原则，仅用于判断，绝不进口播 / 标题 / 文案
#    examples / correct_form = 可以直接说出口的话
# SYNC: forbidden_sentences 被 automation A6 的 gate_1 消费
tone:
  _internal_principle: <一句给自己看的道理，不是台词>
  _internal_logic: <为什么这么做>

  <语气类型A>:                    # 如：展示自己在做事
    position: <出现位置>
    examples: [<用户自己念得出口的原话>]

  <语气类型B>:                    # 如：给出联系入口
    position: 仅 CLOSE
    frequency: <每 N 条一次>
    forbidden_position: [HOOK, SETUP]
    examples: [<...>]

  表达标准:
    weight: highest
    protect_from_auto_cut: true
    rule: 讲事，不讲原则。标准靠具体判断体现，不靠宣称。
    forbidden_sentences: [<用户说出来会别扭的句子>]
    correct_form: [<改成讲具体事的版本>]

  说与不说的分界:
    可以说: 具体的事、具体的数字、当下的感受
    不能说: 任何对自己的评价、任何总结性原则
    检验: 这句话如果是别人说你，是不是在夸你？是 → 你自己不能说。

  forbidden_phrases: [<行业通用的油腻话术>]

# ============ 表层声明 ★ 价值观层 ============
# 账号表层是什么类别，与变现身份可以不同。
# SYNC: 表层标签保护配额由 automation 消费
surface_rule:
  principle: <账号表层的类别，与变现身份可以不同>
  why: <为什么表层要是这个>
  hard_rules: [<可机检的约束>]
  test: <一句判断题，用于逐条自查>

# ============ 身份露出 ★ 价值观层 ============
identity_exposure:
  mode: <本人出现的方式>
  max_per_window: { max: <n>, window: <n>, unit: posts }
  forbidden_contexts: [<不出现在哪些场景>]
  note: 这是上限，不是下限

# ============ 素材复用 ============
reuse_policy:
  min_gap_days: <同一素材再次使用的最小间隔>
  max_reuse_count: <同一素材最多用几次>
  forbid_reuse_in: [<不允许复用的内容类型>]

# ============ 归档 ============
archive:
  keep: [<长期保留什么>]
  retire_after: <多久之后不再复用>
  note: <归档不等于删除>

# ============ 本地化内容 ============
local_content:
  applies_to: [<哪些内容线适用>]
  geo_terms: [<允许出现的地名>]
  note: 只有搜索型内容该带地名，见 references/hot-and-language.md

compliance:
  <领域>: <约束>

scene_vocabulary: [<供素材打标的场景词表>]
fixed_tags: [<每条必带>]
